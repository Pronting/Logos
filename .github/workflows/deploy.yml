name: Deploy to Server (Docker)

on:
  push:
    branches: [main]
    paths:
      - 'src/content/**'
      - 'src/pages/**'
      - 'src/components/**'
      - 'src/i18n/**'
      - 'src/config.ts'
      - 'src/utils/**'
      - 'src/data/**'
      - 'script/generate-ai-summaries.mjs'
      - 'astro.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'public/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-server
  cancel-in-progress: false   # 排队而非取消，避免并发部署把 prev 覆盖错

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH (blue-green + auto rollback)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 12m
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            HEALTH_URL="${{ secrets.DEPLOY_HEALTH_URL || 'http://localhost:9090/' }}"
            export AI_SUMMARY_API_KEY="${{ secrets.AI_SUMMARY_API_KEY || secrets.LLM_API_KEY || secrets.DEEPSEEK_API_KEY }}"
            export AI_SUMMARY_BASE_URL="${{ secrets.AI_SUMMARY_BASE_URL || secrets.LLM_BASE_URL || secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/v1' }}"
            export AI_SUMMARY_API_URL="${{ secrets.AI_SUMMARY_API_URL || secrets.LLM_API_URL || secrets.DEEPSEEK_API_URL }}"
            export AI_SUMMARY_API_PATH="${{ secrets.AI_SUMMARY_API_PATH || secrets.LLM_API_PATH || secrets.DEEPSEEK_API_PATH || '/chat/completions' }}"
            export AI_SUMMARY_MODEL="${{ secrets.AI_SUMMARY_MODEL || secrets.LLM_MODEL || secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}"
            export AI_SUMMARY_TEMPERATURE="${{ secrets.AI_SUMMARY_TEMPERATURE || '0.2' }}"
            export AI_SUMMARY_MAX_INPUT_CHARS="${{ secrets.AI_SUMMARY_MAX_INPUT_CHARS || '18000' }}"
            IMAGE_NAME="logos-app"
            CONTAINER_NAME="logos-app"
            HOST_PORT=9090

            echo "===== 0. 诊断信息 ====="
            echo "  whoami    = $(whoami)"
            echo "  HOME      = $HOME"
            echo "  DEPLOY_PATH='$DEPLOY_PATH'"
            if [ -z "$DEPLOY_PATH" ]; then
              echo "❌ DEPLOY_PATH Secret 未配置或为空！请在 GitHub repo Settings → Secrets 中添加 DEPLOY_PATH" >&2
              exit 1
            fi
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "❌ DEPLOY_PATH=$DEPLOY_PATH 在服务器上不存在！请先 SSH 到服务器手动 git clone 项目到此目录" >&2
              exit 1
            fi
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "❌ DEPLOY_PATH=$DEPLOY_PATH 存在但不是 git 仓库（无 .git 目录）。请先 cd $DEPLOY_PATH && git clone <repo> ." >&2
              exit 1
            fi
            echo "  ✅ DEPLOY_PATH 验证通过（含 .git 目录）"

            cd "$DEPLOY_PATH"

            echo "===== 1. 拉取最新代码 ====="
            git fetch origin main
            git reset --hard origin/main

            echo "===== 2. 备份当前镜像为 ${IMAGE_NAME}:prev ====="
            if docker inspect "$IMAGE_NAME:latest" >/dev/null 2>&1; then
              docker tag "$IMAGE_NAME:latest" "$IMAGE_NAME:prev" || true
              echo "  -> 已将现有 ${IMAGE_NAME}:latest 标记为 ${IMAGE_NAME}:prev"
            else
              echo "  -> 首次部署，无 prev 可备份"
            fi

            echo "===== 3. 安装依赖并构建 ====="
            # 严格前置检查：要求 pnpm + node 已就绪。
            # 不在 CD 里装 Node —— 服务器环境配置是一次性的人工操作。
            if ! command -v pnpm >/dev/null 2>&1; then
              echo "❌ pnpm 不存在。请先在服务器上一次性安装：" >&2
              echo "    curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -" >&2
              echo "    sudo apt install -y nodejs" >&2
              echo "    sudo corepack enable && corepack prepare pnpm@10 --activate" >&2
              echo "    pnpm --version   # 验证" >&2
              exit 1
            fi
            if ! command -v node >/dev/null 2>&1; then
              echo "❌ node 不存在（pnpm 装了但 node 缺？）" >&2
              exit 1
            fi
            echo "  pnpm = $(pnpm --version), node = $(node --version)"
            pnpm install --frozen-lockfile
            if [ -z "${AI_SUMMARY_API_KEY:-}" ]; then
              echo "❌ AI_SUMMARY_API_KEY Secret 未配置，无法在部署时生成 AI 摘要。" >&2
              echo "   请在 GitHub repo Settings → Secrets and variables → Actions 中添加 AI_SUMMARY_API_KEY。" >&2
              exit 1
            fi
            pnpm ai:summary
            pnpm build

            echo "===== 4. 构建新镜像 ====="
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            docker build -t "$IMAGE_NAME:new" -t "$IMAGE_NAME:$TIMESTAMP" .

            echo "===== 5. 切流（蓝绿） ====="
            docker stop "$CONTAINER_NAME" || true
            docker rm   "$CONTAINER_NAME" || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              -p "$HOST_PORT:80" \
              --restart unless-stopped \
              --label commit=$(git rev-parse HEAD) \
              --label deployed_at=$(date -Iseconds) \
              "$IMAGE_NAME:new"

            echo "===== 6. 健康检查（最多 30s） ====="
            for i in 1 2 3 4 5 6; do
              if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
                echo "✅ health check passed on try $i"
                docker tag "$IMAGE_NAME:new" "$IMAGE_NAME:latest"

                # Sync 1Panel openresty reverse proxy (HTTP 301 -> HTTPS -> container)
                # Full logic in script/deploy-reverse-proxy.sh. Never fails the deploy.
                bash "${DEPLOY_PATH}/script/deploy-reverse-proxy.sh"

                echo "===== 部署成功 ====="
                echo "  image  = ${IMAGE_NAME}:latest (=${IMAGE_NAME}:new)"
                echo "  commit = $(git rev-parse HEAD)"
                echo "  visit  = https://${PUBLIC_DOMAIN:-pront.site}/"
                exit 0
              fi
              echo "  retry $i failed, sleeping 5s..."
              sleep 5
            done

            echo "===== ❌ health check failed, rolling back to ${IMAGE_NAME}:prev ====="
            docker stop "$CONTAINER_NAME" || true
            docker rm   "$CONTAINER_NAME" || true
            if docker inspect "$IMAGE_NAME:prev" >/dev/null 2>&1; then
              docker run -d \
                --name "$CONTAINER_NAME" \
                -p "$HOST_PORT:80" \
                --restart unless-stopped \
                "$IMAGE_NAME:prev"
              echo "✅ rolled back to ${IMAGE_NAME}:prev"
            else
              echo "❌ ${IMAGE_NAME}:prev 不存在，无法回滚！容器已停止，请人工介入。" >&2
            fi
            exit 1
                bash "${DEPLOY_PATH}/script/deploy-reverse-proxy.sh"
                echo "===== 部署成功 ====="
                echo "  image  = ${IMAGE_NAME}:latest (=${IMAGE_NAME}:new)"
                echo "  commit = $(git rev-parse HEAD)"
                exit 0
              fi
              echo "  retry $i failed, sleeping 5s..."
              sleep 5
            done

            echo "===== ❌ health check failed, rolling back to ${IMAGE_NAME}:prev ====="
            docker stop "$CONTAINER_NAME" || true
            docker rm   "$CONTAINER_NAME" || true
            if docker inspect "$IMAGE_NAME:prev" >/dev/null 2>&1; then
              docker run -d \
                --name "$CONTAINER_NAME" \
                -p "$HOST_PORT:80" \
                --restart unless-stopped \
                "$IMAGE_NAME:prev"
              echo "✅ rolled back to ${IMAGE_NAME}:prev"
            else
              echo "❌ ${IMAGE_NAME}:prev 不存在，无法回滚！容器已停止，请人工介入。" >&2
            fi
            exit 1
